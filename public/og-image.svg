<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Brand Pill -->
  <g transform="translate(100, 110)">
    <rect width="320" height="42" rx="21" fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#10b981" />
    <text x="42" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" letter-spacing="1">DESARROLLO WEB PROFESIONAL</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">
    JesusDev <tspan fill="#6366f1">·</tspan> Jesus Rojas
  </text>

  <!-- Subheadline -->
  <text x="100" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">
    Sitios web modernos, rápidos y optimizados con React &amp; Tailwind CSS
  </text>

  <!-- Key Badges Strip -->
  <g transform="translate(100, 370)">
    <!-- Badge 1: Landing -->
    <rect x="0" y="0" width="220" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="0.5">LANDING EXPRESS</text>
    <text x="24" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">$120 USD</text>

    <!-- Badge 2: Corporativa -->
    <rect x="240" y="0" width="240" height="70" rx="14" fill="#0f172a" stroke="#4f46e5" stroke-width="2" />
    <text x="264" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="0.5">WEB CORPORATIVA PRO</text>
    <text x="264" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">$200 USD</text>

    <!-- Badge 3: Administrable -->
    <rect x="500" y="0" width="240" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="524" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="0.5">WEB ADMINISTRABLE</text>
    <text x="524" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">$350 USD</text>
  </g>

  <!-- Footer Info inside card -->
  <g transform="translate(100, 510)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#38bdf8">
      jesusdev-six.vercel.app
    </text>
    <text x="750" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#64748b">
      Valencia, Venezuela · Atención Directa 1 a 1
    </text>
  </g>
</svg>
